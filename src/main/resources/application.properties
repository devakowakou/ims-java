spring.application.name=InventoryManagementSystem

# Le port sera fourni par devpu.sh via la variable PORT
server.port=${PORT:5050}

# MYSQL CONNECTION - Utilise les variables d'environnement
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventorydb}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:amede0430}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# THE MAXIMUM SIZE OF IMAGE THAT CAN BE UPLOADED
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# JWT Configuration - Utilise variables d'environnement
# Configuration personnalisée avec @ConfigurationProperties("app.jwt")
app.jwt.secret=${JWT_SECRET:Sindhu1431Sindhu2901SecureJWTKey1234}
app.jwt.expirationMs=${JWT_EXPIRATION_MS:15552000000}